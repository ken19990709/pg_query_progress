# Publishes the one-line trial image (see Dockerfile) to ghcr.io.
#
# Triggers:
#   - every published release
#   - manually: Actions tab -> Docker -> Run workflow
#
# Tags: latest + pg18.  Uses only the built-in GITHUB_TOKEN, scoped by
# the job permissions below; no other secrets are involved.
name: Docker

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Build and push the trial image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=pg18

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
