# CI -- build the extension and run the fast bar-gate smoke scenarios
# against every supported stable PostgreSQL major, plus the leak audit.
#
# The full scenario matrix (see tests/README.md) stays a by-hand gate;
# this job is sized to finish in a few minutes per matrix leg.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16', '17', '18']
    env:
      # Versioned PGDG install layout on Debian/Ubuntu.
      PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Install PostgreSQL ${{ matrix.pg }} from the PGDG apt repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          # PGDG repository, manual setup per postgresql.org's download
          # instructions: dearmored signing key into /etc/apt/keyrings,
          # one deb source signed by it.  The distro codename comes from
          # /etc/os-release (lsb_release is not guaranteed on runners).
          # (The apt.postgresql.org.sh setup script this used to fetch is
          # gone from the mirror; key and repository itself are alive.)
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/keyrings/pgdg.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            postgresql-${{ matrix.pg }} \
            postgresql-client-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            build-essential

      - name: Build (PGXS)
        run: make -s PG_CONFIG="$PG_CONFIG"

      # smoke.sh drives bootstrap.sh with $PG_CONFIG: it initdb's a
      # throwaway instance on a dynamically allocated port (unix-socket
      # only, nothing touches port 5432 or any system cluster), runs the
      # requested scenarios and tears the instance down again on exit.
      # Group S is the two fast bar-gate scenarios: s13 (bar rendering,
      # monotonicity, terminal frame) and s21 (frame gate: short-query
      # silence, GUC defaults, first-frame timing).
      - name: Smoke test (bar-gate scenarios)
        run: tests/smoke.sh S

      - name: Leak audit
        run: tools/audit_leak_check.sh
